<!doctype html>
<html lang="zh-CN" data-theme="red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a0b1c">
<meta name="description" content="红运当头：羊年大吉手机转盘游戏的喜庆红金版界面。选个红包，转出好彩头。">
<title>红运当头 · 羊年大吉</title>
<link rel="icon" type="image/png" href="/assets/fortune-sheep.png">
<link rel="stylesheet" href="/red/style.css?v=1">
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="sparkles"></div></div>
<div class="shell">
<header class="top">
  <a class="brand" href="/red/"><span class="seal" aria-hidden="true">福</span><span class="brand-text"><span class="brand-main">红运当头</span><span class="brand-sub" id="mode-banner">正在连接游戏账户…</span></span></a>
  <div class="top-actions"><button id="sound" class="icon-btn" aria-label="关闭音效" aria-pressed="true">♪</button><button id="rules-open" class="pill-btn">玩法</button></div>
  <button id="wallet-top" class="wallet-top" type="button" aria-label="连接钱包"><span class="wallet-top-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V5a2 2 0 0 0-2-2H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H6a1 1 0 0 1 0-2h11M21 12h-5a2 2 0 0 0 0 4h5"/></svg><span id="wallet-top-label">连接钱包</span></span><span id="wallet-top-balance">查看持币数量</span></button>
</header>
<main>
<section id="play-view" class="view" aria-labelledby="play-title">
  <div class="hud">
    <button class="packet-card" data-tab="account"><span class="packet-seal" aria-hidden="true">币</span><span class="packet-body"><small>游戏余额 · <em id="coin-unit">币</em></small><strong id="balance">—</strong></span></button>
    <button class="packet-card" data-tab="rewards"><span class="packet-seal ingot-seal" aria-hidden="true">宝</span><span class="packet-body"><small>金元宝</small><strong id="ingots-inline">—</strong></span></button>
  </div>
  <div class="stage-card">
    <i class="crackers crackers-left" aria-hidden="true"></i><i class="crackers crackers-right" aria-hidden="true"></i>
    <h1 id="play-title" class="banner-title"><span>❁</span>福气转不停<span>❁</span></h1>
    <p id="protection-note" class="bet-note" aria-live="polite" hidden></p>
    <div class="stage" id="wheel-stage" role="img" aria-label="幸运转盘">
      <div class="rays" aria-hidden="true"></div>
      <div class="rim"><div class="rotor" id="wheel-rotor"></div></div>
      <div class="hub" aria-hidden="true"><img id="mascot" src="/assets/fortune-sheep.png" alt="" width="1254" height="1254" fetchpriority="high"></div>
      <div class="pointer" aria-hidden="true"></div>
    </div>
    <div class="outcome"><p class="stage-message" id="stage-message" role="status">选个红包，转出好彩头</p><div class="result" id="result" role="status" hidden></div><div id="connection-message" class="connection" role="status"></div></div>
  </div>
</section>
<section id="rewards-view" class="view page" aria-labelledby="rewards-title" hidden>
  <div class="page-head"><h1 id="rewards-title">金元宝</h1><p>抽中 0× 或 0.5× 时，损失的代币按 1:1 变成金元宝</p></div>
  <div class="vault">
    <span class="vault-glyph" aria-hidden="true">宝</span>
    <span id="ingot-mode-label" class="vault-label">我的金元宝</span>
    <strong id="ingot-balance">—</strong>
    <p>投入 1,000 币：0× 得 1,000 金元宝；0.5× 得 500 金元宝。</p>
    <button class="ghost-btn" disabled>兑换暂未开放</button>
    <p class="fine-dark">后续计划支持 XAUT 等奖励，兑换比例与规则待公布。金元宝目前不能提币，也不计入代币余额。</p>
  </div>
  <div class="list-head"><h2>最近获取记录</h2><button id="refresh-ingots" class="link-btn">刷新</button></div>
  <div id="ingot-records" class="records"><p class="empty-note">还没有金元宝记录</p></div>
</section>
<section id="account-view" class="view page" aria-labelledby="account-title" hidden>
  <div class="page-head"><h1 id="account-title">我的账户</h1><p id="account-description">连接钱包后查看余额</p></div>
  <div class="cream-card account-card">
    <span>可用余额</span><strong id="account-balance">—</strong>
    <div class="account-actions"><button id="deposit-open" class="gold-btn">充值</button><button id="withdraw-open" class="ghost-btn">提现</button></div>
    <div class="account-line"><span>提现处理中</span><b id="locked-balance">0</b></div>
  </div>
  <button class="menu-row" id="wallet-connect"><span>连接钱包</span><span aria-hidden="true">›</span></button>
  <p class="wallet-address" id="wallet-address"></p>
  <button class="menu-row" id="invite-open"><span>邀请好友 · 推荐奖励</span><span aria-hidden="true">›</span></button>
  <button class="menu-row" id="payments-open"><span>充值与提现记录</span><span aria-hidden="true">›</span></button>
  <div class="list-head"><h2>最近游戏记录</h2><button id="refresh-records" class="link-btn">刷新</button></div>
  <div id="records" class="records"><p class="empty-note">还没有游戏记录</p></div>
  <nav class="skins" aria-label="切换界面风格"><span>换个风格：</span><a href="/">经典红金</a><a href="/night/">福运夜市</a><a href="/jade/">翡翠麻将馆</a><a href="/red/" aria-current="page">红运当头</a></nav>
</section>
</main>
<div class="dock" id="dock"><div class="packets" id="bet-choices">
      <button class="packet" data-bet="500" aria-pressed="true"><b>500</b><small>币</small></button>
      <button class="packet" data-bet="1000" aria-pressed="false"><b>1,000</b><small>币</small></button>
      <button class="packet" data-bet="2000" aria-pressed="false"><b>2,000</b><small>币</small></button>
      <button class="packet" data-bet="5000" aria-pressed="false"><b>5,000</b><small>币</small></button>
    </div><button id="start" class="spin-btn" disabled><span class="spin-label">转一下</span><small id="start-cost">本局投入 500 币</small></button></div>
<nav class="plaques" aria-label="主要功能">
  <button data-tab="play" class="active" aria-current="page"><i aria-hidden="true"></i><span>玩游戏</span></button>
  <button data-tab="rewards"><i aria-hidden="true"></i><span>金元宝</span></button>
  <button data-tab="account"><i aria-hidden="true"></i><span>我的账户</span></button>
</nav>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭弹窗">×</button></header><div id="dialog-content"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/red/app.js?v=1"></script>
</body>
</html>
